[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "awg-tg-bot"
version = "0.1.0"
description = "Telegram bot that issues AmneziaWG (AmneziaVPN) keys on your own server"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
awgbot = "awgbot.__main__:main"

[tool.setuptools.packages.find]
include = ["awgbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
