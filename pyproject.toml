[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deeptraversal"
version = "0.1.0"
description = "Self-service key provisioning for AmneziaWG: peers, IP pool, revoke, Telegram bot and CLI"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
awgbot = "awgbot.__main__:main"      # the import package stays `awgbot`

[tool.setuptools.packages.find]
include = ["awgbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
